# Сборка установщика SdelkiAmoCRM-Setup.exe и публикация в Releases.
# Запуск: отправить тег вида v1.0.3 (git tag v1.0.3 && git push origin v1.0.3).
# Ручной запуск (Actions → Release exe → Run workflow) собирает установщик как артефакт, без релиза.
name: Release exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Версия программы
        id: ver
        shell: pwsh
        run: |
          $ver = (Select-String -Path paths.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$ver" >> $env:GITHUB_OUTPUT
          if ("${{ github.ref_type }}" -eq "tag" -and "v$ver" -ne "${{ github.ref_name }}") {
            throw "VERSION в paths.py ($ver) не совпадает с тегом ${{ github.ref_name }}"
          }

      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Загрузка Chromium для установщика
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/chromium-browsers
        run: python -m playwright install chromium --no-shell

      - name: Сборка программы (папкой)
        run: pyinstaller --noconfirm --clean SdelkiAmoCRM.spec

      - name: Установка Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Сборка установщика
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup завершился с ошибкой" }
          $f = Get-Item dist/SdelkiAmoCRM-Setup.exe
          "Установщик: {0:N1} МБ" -f ($f.Length / 1MB)

      - name: Публикация релиза
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/SdelkiAmoCRM-Setup.exe --title "${{ github.ref_name }}" --generate-notes

      - name: Установщик как артефакт (ручной запуск)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: SdelkiAmoCRM-Setup
          path: dist/SdelkiAmoCRM-Setup.exe
