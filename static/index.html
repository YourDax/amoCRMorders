<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сделки в amoCRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%231d5fa8'/%3E%3Cpath d='M8 9h16M8 16h16M8 23h10' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<script>try{const t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* Рабочий инструмент: плотно, спокойно, как офисная программа.
   Плоские панели, минимальные скругления, таблица как лист Excel. */
:root{
  --bg:#efefec; --surface:#fff; --head:#f6f6f4; --hover:#f3f5f8;
  --text:#1c1c1c; --muted:#5f5f5c; --faint:#8b8b87;
  --line:#dededa; --line-2:#c6c6c1;
  --accent:#1d5fa8; --accent-hover:#174d8a; --accent-weak:#e6edf6;
  --ok:#1d7a3b; --err:#b3261e; --err-weak:#fbeceb;
  --warn:#7d5500; --warn-weak:#fdf3d8; --warn-line:#e2c470;
  --input:#fff; --r:3px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#18191b; --surface:#212225; --head:#26272b; --hover:#2a2d33;
    --text:#e6e6e3; --muted:#a2a29e; --faint:#7a7a76;
    --line:#323338; --line-2:#45464c;
    --accent:#4f8fd6; --accent-hover:#6aa2e0; --accent-weak:#1f2f44;
    --ok:#5cb87a; --err:#ef7b72; --err-weak:#3a2220;
    --warn:#e0b44d; --warn-weak:#352c17; --warn-line:#6e5a26;
    --input:#1b1c1f;
    color-scheme:dark;
  }
}
:root[data-theme=dark]{
    --bg:#18191b; --surface:#212225; --head:#26272b; --hover:#2a2d33;
    --text:#e6e6e3; --muted:#a2a29e; --faint:#7a7a76;
    --line:#323338; --line-2:#45464c;
    --accent:#4f8fd6; --accent-hover:#6aa2e0; --accent-weak:#1f2f44;
    --ok:#5cb87a; --err:#ef7b72; --err-weak:#3a2220;
    --warn:#e0b44d; --warn-weak:#352c17; --warn-line:#6e5a26;
    --input:#1b1c1f;
    color-scheme:dark;
  }
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--bg);color:var(--text);
  font:13px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* шапка */
header{display:flex;align-items:center;gap:16px;height:44px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:5}
header h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.1px}
.spacer{flex:1}
#ver{color:var(--faint);font-size:12px}
#theme{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;font-size:12px;color:var(--muted)}
#theme svg{width:14px;height:14px}
#theme:hover:not(:disabled){color:var(--text)}
.status-conn{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--muted);font:inherit;font-size:12px;cursor:pointer;transition:border-color .15s,color .15s}
.status-conn::before{content:"";width:7px;height:7px;border-radius:1px;background:var(--faint)}
.status-conn:hover{border-color:var(--accent);color:var(--text)}
.status-conn.on{border-color:transparent;color:var(--ok)}
.status-conn.on:hover{border-color:var(--line-2);color:var(--ok)}
.status-conn.on::before{background:var(--ok)}

main{padding:14px 20px 32px;display:grid;gap:12px}
main>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-body{padding:12px 14px}

/* кнопки и поля */
button{font:inherit;height:30px;padding:0 12px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);border-radius:var(--r);cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
button:hover:not(:disabled){border-color:var(--muted)}
button:active:not(:disabled){background:var(--head)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}
button.big{height:34px;padding:0 18px}
button.danger{color:var(--err);border-color:var(--err)}
button.danger:hover:not(:disabled){background:var(--err-weak);border-color:var(--err)}
button.link{border:none;background:none;color:var(--accent);padding:0 6px;height:26px}
button.link:hover:not(:disabled){text-decoration:underline;background:none}
button:disabled{opacity:.45;cursor:not-allowed}
select,.meta input{font:inherit;height:30px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--input);color:var(--text)}
select{min-width:220px;padding-right:4px}
input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0;vertical-align:middle}

/* загрузка */
#drop{border:1px dashed var(--line-2);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--muted);cursor:pointer;background:var(--head);transition:border-color .15s,background-color .15s}
#drop.over,#drop:hover{border-color:var(--accent);background:var(--accent-weak);color:var(--text)}
#drop .big-t{font-size:15px;color:var(--text);font-weight:600;margin-bottom:2px}
body.loaded #drop{padding:0 12px;height:30px;display:inline-flex;align-items:center;gap:6px;font-size:12px;border-style:solid;background:var(--surface)}
body.loaded #drop .big-t{font-size:12px;font-weight:600;margin:0;color:var(--accent)}
.filebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
body:not(.loaded) .filebar{display:block}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;color:var(--muted)}
.meta>*{padding:0 14px;border-left:1px solid var(--line)}
.meta>*:first-child{border-left:none;padding-left:0}
.meta b{color:var(--text);font-weight:600}
.meta .fname{color:var(--text);font-weight:600}
.meta label{display:inline-flex;align-items:center;gap:8px}
.meta input{width:150px;height:26px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;padding:0 !important}
.seg button{height:26px;border:none;border-radius:0;padding:0 10px;font-size:12px;background:var(--surface);color:var(--muted)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button:hover:not(:disabled){color:var(--text);border-color:var(--line-2)}
.seg button[aria-pressed=true]{background:var(--accent-weak);color:var(--accent);font-weight:600}
.meta .seg-wrap{display:inline-flex;align-items:center;gap:8px}
.warn{background:var(--warn-weak);color:var(--warn);border-left:3px solid var(--warn-line);border-radius:0 var(--r) var(--r) 0;padding:7px 12px;margin-top:10px;font-size:12px}

/* панель запуска */
.action{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.action label{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.action .lbl{color:var(--muted)}
#progress{display:none;margin-top:12px}
#progress.show{display:block}
.bar{height:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease-out}
.ptext{display:flex;gap:14px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.ptext b{color:var(--text)}
#lastLog{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#waiting{display:none;margin-top:12px;background:var(--warn-weak);border-left:3px solid var(--warn-line);padding:8px 12px;align-items:center;gap:12px}
#waiting.show{display:flex}
#waiting span{flex:1;color:var(--text)}

/* таблица */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1050px}
th,td{padding:0 6px;height:32px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{position:sticky;top:0;background:var(--head);height:30px;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line-2)}
th:first-child,td:first-child{width:34px;text-align:center;padding:0 0 0 4px}
th:nth-child(3),td:nth-child(3),th:nth-child(5),td:nth-child(5),th:nth-child(7),td:nth-child(7),th:nth-child(8),td:nth-child(8){border-left:1px solid var(--line)}
tbody tr:hover td{background:var(--hover)}
td input[type=text]{width:100%;height:26px;padding:0 6px;border:1px solid transparent;border-radius:2px;background:transparent;color:var(--text);font:inherit}
td input[type=text]:hover{border-color:var(--line-2)}
td input[type=text]:focus{outline:none;border-color:var(--accent);background:var(--input);box-shadow:0 0 0 1px var(--accent)}
td input.bad{border-color:var(--warn-line);background:var(--warn-weak)}
td.name input{font-weight:600}
td.info{font-size:12px;color:var(--muted);max-width:200px}
td.info div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.info .badge{margin-right:8px}
tr.done td{opacity:.55}
tr.done td.status{opacity:1}
tr.off td:not(:first-child):not(.status):not(:last-child){opacity:.5}
tr.red td:first-child{box-shadow:inset 3px 0 0 var(--err)}
tr.red td.name input{color:var(--err)}

/* статусы: текст с квадратным маркером, без «пилюль» */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;color:var(--muted)}
.badge::before{content:"";width:7px;height:7px;border-radius:1px;background:currentColor;flex:none}
.b-ok{color:var(--ok)} .b-err,.b-red{color:var(--err)}
.b-work{color:var(--accent)} .b-q{color:var(--faint)}
.b-part,.b-ref{color:var(--warn)}
.note{display:block;font-size:12px;margin-top:2px} .note.ok{color:var(--ok)} .note.no{color:var(--warn)} .note.err{color:var(--err)}
.b-work::before{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{opacity:.25}}
@media (prefers-reduced-motion: reduce){ .b-work::before{animation:none} .bar i{transition:none} }
td.status{min-width:190px}
td.status a{color:var(--accent);font-size:12px;margin-left:8px;text-decoration:none;white-space:nowrap}
td.status a:hover{text-decoration:underline}
td.status .err{display:block;color:var(--err);font-size:11px;line-height:1.3;max-width:240px;padding-bottom:3px;text-wrap:pretty}
.cell{display:flex;align-items:center;gap:2px}
button.x{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;padding:0;border:none;background:transparent;color:var(--faint);border-radius:2px}
button.x svg{width:14px;height:14px;pointer-events:none}
button.x:hover:not(:disabled){background:var(--err-weak);color:var(--err)}
.below{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);background:var(--head);color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:30px;height:auto}
.hidden{display:none !important}
details summary{cursor:pointer;color:var(--muted);font-size:12px;padding:8px 14px;user-select:none}
details summary:hover{color:var(--text)}
#log{font:12px/1.5 "Cascadia Mono",Consolas,ui-monospace,monospace;background:var(--input);border-top:1px solid var(--line);padding:10px 14px;height:240px;overflow:auto;white-space:pre-wrap;margin:0}
@media (max-width:700px){ header{padding:0 16px} main{padding:12px 16px} .meta>*{padding:0 10px} select{min-width:0;max-width:100%} }
</style>
</head>
<body>
<header>
  <h1>Сделки в amoCRM</h1>
  <button id="conn" class="status-conn" title="Открыть окно amoCRM и войти">amoCRM: войти</button>
  <div class="spacer"></div>
  <button id="theme" title="Сменить тему оформления"></button>
  <span id="ver"></span>
</header>

<main>
  <!-- 1. файл -->
  <section class="panel panel-body">
    <div class="filebar">
      <div id="drop"><div class="big-t">Перетащите сюда отчёт .xlsx</div>или нажмите, чтобы выбрать файл</div>
      <div class="meta hidden" id="meta"></div>
    </div>
    <input type="file" id="file" accept=".xlsx" hidden>
    <div id="warnings"></div>
  </section>

  <!-- 2. действие -->
  <section class="panel panel-body hidden" id="actionCard">
    <div class="action">
      <label><span class="lbl">Воронка</span> <select id="pipeline"></select></label>
      <label title="Точное название беседы в MAX, например «Щ_10 - Зима 2026». Из неё в примечание каждой сделки попадёт список детей её класса (самое свежее сообщение). Пусто — без списков"><span class="lbl">Чат MAX со списками</span> <input id="maxChat" placeholder="например, Щ_10 - Зима 2026" size="26"></label>
      <label title="Перед каждым «Сохранить» бот остановится, чтобы вы проверили форму"><input type="checkbox" id="step"> Проверять перед сохранением</label>
      <div class="spacer"></div>
      <button class="danger hidden" id="btnStop">Стоп</button>
      <button class="primary big" id="btnRun" disabled>Создать сделки</button>
    </div>
    <div id="waiting"><span id="waitText"></span><button class="primary" id="btnContinue">Продолжить</button></div>
    <div id="progress">
      <div class="bar"><i id="barFill"></i></div>
      <div class="ptext"><span id="pCount"></span><span id="lastLog"></span></div>
    </div>
  </section>

  <!-- 3. таблица -->
  <section class="panel hidden" id="tableCard">
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th><input type="checkbox" id="all" title="Выбрать все"></th>
          <th>Название сделки</th>
          <th id="hLeadName">ФИО КР</th><th id="hLeadPhone">Телефон КР</th><th>ФИО РК</th><th>Телефон РК</th>
          <th>Доп. информация</th><th>Статус</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="below">
      <span>Ячейки можно править. × у телефона убирает контакт, корзина — строку.</span>
      <div class="spacer"></div>
      <button class="link hidden" id="btnRetry">Повторить ошибочные</button>
      <button class="link hidden" id="btnNotes" title="Добавить список детей из чата MAX в уже созданные сделки, где его ещё нет">Списки детей в созданные</button>
      <button class="link" id="btnRestore">Вернуть как в файле</button>
      <button class="link" id="btnClear">Очистить</button>
    </div>
  </section>

  <section class="panel">
    <details id="logBox"><summary>Подробный журнал</summary><pre id="log"></pre></details>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone = x => JSON.parse(JSON.stringify(x));
const store = {
  get(k, d=""){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} },
};

let deals = [], original = [], school = "", prefix = "", fileSchool = "", kind = "school", fileKind = "school";
// школа: сделка «1а ВХТЛ-сп4», первый контакт КР; детский сад: «гр.11 1368-до4», первый контакт ВС
const KIND = {
  school:       {lead: "КР", place: "Школа",       units: "Классов"},
  kindergarten: {lead: "ВС", place: "Детский сад", units: "Групп"},
};
const lead = () => KIND[kind].lead;
function autoName(klass, place, k, pre = ""){
  klass = String(klass ?? "").trim();
  if(k === "kindergarten") klass = "гр." + klass.replace(/^гр(уппа)?\.?\s*/i, "");
  return `${pre.trim()} ${klass} ${place}`.trim().replace(/\s+/g, " ");
}
// ФИО с заглавных букв: «диля халимовна» → «Диля Халимовна», «анна-мария» → «Анна-Мария»
const fixNameCase = s => s.split(/(\s+)/).map(w => w.split("-").map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase()).join("-")).join("");
let S = {rows:{}, running:false, log:[]};
const byId = id => deals.find(x => x.id === id);
const isDone = d => d.doneStatus === "uncertain" || (d.done && d.doneStatus !== "partial");

async function post(url, body){
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) alert(j.error || "Ошибка");
  return r.ok;
}

// ---------- тема ----------
const THEMES = {
  auto:  {next:"light", label:"Тема: как в системе", icon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="9" rx="1"/><path d="M5.5 14h5M8 11.5V14"/></svg>'},
  light: {next:"dark",  label:"Тема: светлая", icon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.8M8 13.2V15M1 8h1.8M13.2 8H15M3 3l1.3 1.3M11.7 11.7L13 13M3 13l1.3-1.3M11.7 4.3L13 3"/></svg>'},
  dark:  {next:"auto",  label:"Тема: тёмная", icon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5z"/></svg>'},
};
function applyTheme(t){
  if(!THEMES[t]) t = "auto";
  if(t === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = t;
  $("#theme").innerHTML = THEMES[t].icon + `<span>${THEMES[t].label}</span>`;
  $("#theme").dataset.t = t;
}
$("#theme").onclick = () => { const t = THEMES[$("#theme").dataset.t].next; store.set("theme", t); applyTheme(t); };
applyTheme(store.get("theme", "auto"));

// ---------- проверка данных ----------
const PHONE_RE = /^\+7\d{10}(\s*\(.+\))?$/;
function problems(d){
  const p = {};
  if(!d.name.trim()) p.name = "Пустое название";
  for(const who of ["kr","rk"]){
    const c = d[who], label = who === "kr" ? lead() : "РК";
    if(c.name.trim() && !c.phone.trim()) p[who+".phone"] = `Нет телефона ${label}`;
    if(c.phone.trim() && !PHONE_RE.test(c.phone.trim())) p[who+".phone"] = `Телефон ${label} не похож на +7XXXXXXXXXX`;
    if(!c.name.trim() && c.phone.trim()) p[who+".name"] = `Нет ФИО ${label}`;
  }
  if(!d.kr.name.trim() && !d.kr.phone.trim()) p["kr.name"] = `Нет ${lead()}`;
  return p;
}

// ---------- загрузка файла ----------
const drop = $("#drop"), fileInp = $("#file");
drop.onclick = () => fileInp.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); if(e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
fileInp.onchange = () => fileInp.files[0] && upload(fileInp.files[0]);
// файл можно бросить в любое место окна
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); if(e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });

async function upload(f){
  if(S.running){ alert("Дождитесь окончания или нажмите «Стоп»"); return; }
  if(!/\.xlsx$/i.test(f.name)){ alert("Нужен файл .xlsx"); return; }
  const fd = new FormData(); fd.append("file", f); fd.append("pipeline", $("#pipeline").value);
  const r = await fetch("/api/parse", {method:"POST", body: fd});
  const j = await r.json();
  fileInp.value = "";
  if(!r.ok){ alert(j.error); return; }
  j.deals.forEach(d => d.sel = !isDone(d) && !d.red);
  original = clone(j.deals); deals = clone(j.deals); school = j.school || "";
  prefix = ""; fileSchool = school; kind = fileKind = j.kind === "kindergarten" ? "kindergarten" : "school";
  document.body.classList.add("loaded");
  $("#drop").innerHTML = '<span class="big-t">Другой файл…</span>';
  const refused = deals.filter(d => d.refused && !d.red).length, red = deals.filter(d => d.red).length, done = deals.filter(isDone).length;
  $("#meta").classList.remove("hidden");
  $("#meta").innerHTML = `<span class="fname" title="Загруженный отчёт">${esc(j.file)}</span>
    <span class="seg-wrap" title="Определено по файлу. Меняет названия сделок и первый контакт (КР / ВС)">
      <span class="seg" role="group" aria-label="Тип учреждения">
        <button type="button" data-kind="school">Школа</button><button type="button" data-kind="kindergarten">Детский сад</button>
      </span></span>
    <label><span id="placeLbl"></span> <input id="school" value="${esc(school)}" title="Поменяет название во всех сделках"></label>
    <label title="Добавляется в начало названия всех сделок и «Названия компании», например НГ → «НГ 3в Под_18-сп1»">Префикс <input id="prefix" value="" placeholder="например, НГ" size="10"></label>
    <span><span id="unitsLbl"></span>: <b>${deals.length}</b></span>
    ${done ? `<span>Уже созданы: <b>${done}</b></span>` : ""}
    ${red ? `<span>Красные в файле: <b>${red}</b> (не отмечены)</span>` : ""}
    ${refused ? `<span>Похоже на отказ: <b>${refused}</b></span>` : ""}`;
  $("#school").onchange = e => rename(e.target.value.trim(), kind, prefix);
  $("#prefix").onchange = e => rename(school, kind, e.target.value.trim());
  document.querySelectorAll(".seg [data-kind]").forEach(b => b.onclick = () => rename(school, b.dataset.kind, prefix));
  applyKindUI();
  $("#warnings").innerHTML = j.warnings.length ? `<div class="warn">${j.warnings.map(esc).join("<br>")}</div>` : "";
  $("#actionCard").classList.remove("hidden"); $("#tableCard").classList.remove("hidden");
  renderRows();
}

// новое название учреждения или тип: переименовать сделки, у которых название не правили вручную
function rename(newSchool, newKind, newPrefix){
  if(S.running){ alert("Дождитесь окончания или нажмите «Стоп»"); applyKindUI(); if($("#prefix")) $("#prefix").value = prefix; return; }
  for(const d of deals){
    const place = newSchool === school ? d.school : newSchool;
    const type = newKind === kind ? d.kind : newKind;
    if(d.name === autoName(d.klass, d.school, d.kind, prefix)) d.name = autoName(d.klass, place, type, newPrefix);
    d.school = place; d.kind = type;
  }
  school = newSchool; kind = newKind; prefix = newPrefix;
  applyKindUI(); renderRows(); refreshProgress();
}
function applyKindUI(){
  const K = KIND[kind];
  document.querySelectorAll(".seg [data-kind]").forEach(b => b.setAttribute("aria-pressed", b.dataset.kind === kind));
  if($("#placeLbl")) $("#placeLbl").textContent = K.place;
  if($("#unitsLbl")) $("#unitsLbl").textContent = K.units;
  $("#hLeadName").textContent = `ФИО ${K.lead}`;
  $("#hLeadPhone").textContent = `Телефон ${K.lead}`;
}

// ---------- таблица ----------
function renderRows(){
  if(!deals.length){
    $("#rows").innerHTML = `<tr><td colspan="9" class="empty">${original.length ? "Список пуст — «Вернуть как в файле» восстановит строки" : "Нет строк"}</td></tr>`;
    updateUI(); return;
  }
  $("#rows").innerHTML = deals.map(d => {
    const inp = (f, v) => `<input type="text" data-f="${f}" value="${esc(v)}">`;
    return `<tr data-id="${d.id}" class="${d.red ? 'red' : ''}">
      <td><input type="checkbox" class="sel" ${d.sel?'checked':''}></td>
      <td class="name" title="${esc(d.sheet)}, строка ${d.row}">${inp("name", d.name)}</td>
      <td>${inp("kr.name", d.kr.name)}</td>
      <td><div class="cell">${inp("kr.phone", d.kr.phone)}<button class="x" data-clear="kr" title="Убрать ${lead()} из этой сделки"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div></td>
      <td>${inp("rk.name", d.rk.name)}</td>
      <td><div class="cell">${inp("rk.phone", d.rk.phone)}<button class="x" data-clear="rk" title="Убрать РК из этой сделки"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div></td>
      <td class="info" title="${esc(d.red ? 'Строка помечена в файле красным — по умолчанию не создаётся. ' : '')}${esc(d.info)}">${d.red ? '<span class="badge b-red">красная в файле</span>' : ''}${d.refused ? '<span class="badge b-ref">отказ?</span>' : ''}<div>${esc(d.info)}</div></td>
      <td class="status"></td>
      <td><button class="x" data-del title="Убрать строку из списка"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.8 6.5v5M9.2 6.5v5"/></svg></button></td>
    </tr>`;
  }).join("");
  deals.forEach(markProblems);
  paintStatuses(); updateUI();
}

function markProblems(d){
  const tr = document.querySelector(`tr[data-id="${d.id}"]`); if(!tr) return;
  const p = problems(d);
  tr.querySelectorAll("input[type=text]").forEach(i => {
    const msg = p[i.dataset.f];
    i.classList.toggle("bad", !!msg);
    i.title = msg || "";
  });
  tr.classList.toggle("off", !d.sel);
}

$("#rows").addEventListener("input", e => {
  const inp = e.target; if(!inp.dataset.f) return;
  const d = byId(inp.closest("tr").dataset.id);
  const [a,b] = inp.dataset.f.split(".");
  if(b) d[a][b] = inp.value; else d[a] = inp.value;
  markProblems(d); updateUI();
});
$("#rows").addEventListener("change", e => {
  const f = e.target.dataset.f;
  if(f === "name") refreshProgress();
  if(f === "kr.name" || f === "rk.name"){  // ФИО — с заглавных букв
    const d = byId(e.target.closest("tr").dataset.id), fixed = fixNameCase(e.target.value);
    if(fixed !== e.target.value){ e.target.value = fixed; d[f.split(".")[0]].name = fixed; markProblems(d); }
    return;
  }
  if(!e.target.classList.contains("sel")) return;
  const d = byId(e.target.closest("tr").dataset.id); d.sel = e.target.checked;
  markProblems(d); updateUI();
});
$("#rows").addEventListener("click", async e => {
  const forget = e.target.dataset && e.target.dataset.forget;
  if(forget){
    e.preventDefault();
    if(!confirm(`Создать «${forget}» ещё раз? В amoCRM появится вторая такая сделка.`)) return;
    if(!await post("/api/forget", {name: forget, pipeline: $("#pipeline").value})) return;
    for(const list of [deals, original]){ const x = list.find(x => x.name === forget); if(x){ x.done = null; x.doneStatus = null; x.sel = true; } }
    renderRows(); return;
  }
  const btn = e.target.closest("button.x"); if(!btn) return;
  if(S.running){ alert("Дождитесь окончания или нажмите «Стоп»"); return; }
  const tr = btn.closest("tr"), d = byId(tr.dataset.id);
  if(btn.dataset.clear){
    d[btn.dataset.clear] = {name:"", phone:""};
    tr.querySelector(`[data-f="${btn.dataset.clear}.name"]`).value = "";
    tr.querySelector(`[data-f="${btn.dataset.clear}.phone"]`).value = "";
    markProblems(d); updateUI();
  } else if(btn.hasAttribute("data-del")){
    deals = deals.filter(x => x !== d); renderRows();
  }
});

$("#all").onchange = e => {
  deals.forEach(d => { if(!isDone(d)) d.sel = e.target.checked; });
  renderRows();
};
$("#btnRestore").onclick = () => {
  if(S.running) return;
  if(!confirm("Вернуть все строки и значения как в файле? Ваши правки пропадут.")) return;
  deals = clone(original); kind = fileKind; school = fileSchool; prefix = "";
  if($("#prefix")) $("#prefix").value = "";
  applyKindUI(); renderRows();
};
$("#btnClear").onclick = () => {
  if(S.running) return;
  if(!confirm("Очистить список? В amoCRM ничего не удалится.")) return;
  deals = []; original = [];
  document.body.classList.remove("loaded");
  $("#drop").innerHTML = '<div class="big-t">Перетащите сюда отчёт .xlsx</div>или нажмите, чтобы выбрать файл';
  ["#meta","#actionCard","#tableCard"].forEach(s => $(s).classList.add("hidden"));
  $("#warnings").innerHTML = "";
};

function paintStatuses(){
  for(const d of deals){
    const tr = document.querySelector(`tr[data-id="${d.id}"]`); if(!tr) continue;
    const s = S.rows[d.id] || {};
    if((s.status === "ok" || s.status === "skip") && !d._final){
      d._final = true; d.sel = false; d.done = s.url; d.doneStatus = "ok";
      tr.querySelector(".sel").checked = false; markProblems(d);
    }
    let html = "";
    const url = s.url || d.done;
    if(s.status === "ok") html = '<span class="badge b-ok">создана</span>';
    else if(s.status === "skip") html = '<span class="badge b-ok">уже была</span>';
    else if(s.status === "work") html = '<span class="badge b-work">создаётся…</span>';
    else if(s.status === "queued") html = '<span class="badge b-q">в очереди</span>';
    else if(s.status === "error") html = `<span class="badge b-err">ошибка</span><span class="err">${esc(s.error)}</span>`;
    else if(s.status === "partial") html = `<span class="badge b-part">не полностью</span><span class="err">${esc(s.error)}</span>`;
    else if(s.status === "uncertain" || d.doneStatus === "uncertain") html = '<span class="badge b-err">проверить сохранение в amoCRM</span>';
    else if(d.doneStatus === "partial") html = '<span class="badge b-part">дозаполнить</span>';
    else if(d.done) html = '<span class="badge b-ok">уже создана</span>';
    if(url) html += ` <a href="${esc(url)}" target="_blank">открыть</a>`;
    if(s.note === "ok" || (d.note && !s.status)) html += '<span class="note ok" title="В сделку добавлено примечание со списком детей из MAX">список детей ✓</span>';
    else if(s.note === "none") html += '<span class="note no" title="В чате MAX нет сообщения со списком этого класса">нет списка в MAX</span>';
    else if(s.note === "error") html += '<span class="note err" title="Подробности — в журнале">список не добавлен</span>';
    if((isDone(d) && !s.status) || s.status === "uncertain" || d.doneStatus === "uncertain") html += ` <a href="#" data-forget="${esc(d.name)}">ещё раз</a>`;
    const cell = tr.querySelector(".status");
    if(cell.innerHTML !== html) cell.innerHTML = html;
    tr.classList.toggle("done", isDone(d) || s.status === "ok" || s.status === "skip");
  }
}

function selected(){ return deals.filter(d => d.sel); }
// созданные сделки без списка детей
function noteRows(){ return deals.filter(d => d.doneStatus !== "uncertain" && (isDone(d) || ["ok","skip"].includes((S.rows[d.id]||{}).status)) && !d.note && (S.rows[d.id]||{}).note !== "ok"); }
function failedRows(){ return deals.filter(d => ["error","partial"].includes((S.rows[d.id]||{}).status)); }

function updateUI(){
  const sel = selected(), n = sel.length;
  const bad = sel.filter(d => Object.keys(problems(d)).length).length;
  const btn = $("#btnRun");
  btn.textContent = S.running ? "Идёт создание…" : n ? `Создать ${n} ${plural(n, "сделку","сделки","сделок")}` : "Отметьте сделки";
  btn.disabled = !n || S.running;
  btn.title = bad ? `У ${bad} выбранных есть замечания (подсвечены жёлтым) — можно создавать и так` : "";
  $("#btnStop").classList.toggle("hidden", !S.running);
  $("#btnRetry").classList.toggle("hidden", S.running || !failedRows().length);
  $("#btnNotes").classList.toggle("hidden", S.running || !noteRows().length);
  const selectable = deals.filter(d => !isDone(d));
  $("#all").checked = selectable.length > 0 && selectable.every(d => d.sel);
  document.querySelectorAll("button.x").forEach(b => b.disabled = S.running);
}
const plural = (n, one, few, many) => (n%10===1 && n%100!==11) ? one : (n%10>=2 && n%10<=4 && (n%100<10||n%100>=20)) ? few : many;

// ---------- запуск ----------
function editedClass(d){
  let name = d.name.trim();
  if(prefix && name.startsWith(prefix + " ")) name = name.slice(prefix.length).trim();
  if(d.school && name.endsWith(" " + d.school)) return name.slice(0, -d.school.length).trim();
  const match = name.match(/^(?:гр(?:уппа)?\.?\s*)?\d{1,2}(?:\s*[-«"]?\s*[а-яёa-z]{1,2}[»"]?)?(?=\s|$)/i);
  return match ? match[0] : d.klass;
}
async function run(list, notesOnly = false){
  const items = list.map(d => ({ id: d.id, name: d.name.trim(), klass: editedClass(d), contacts: [{role: KIND[d.kind].lead, ...d.kr}, {role:"РК", ...d.rk}] }));
  const maxChat = $("#maxChat").value.trim();
  if(notesOnly){
    if(!maxChat){ alert("Впишите название чата MAX со списками детей"); $("#maxChat").focus(); return; }
    if(!confirm(`Добавить списки детей из чата MAX «${maxChat}» в ${items.length} ${plural(items.length,"созданную сделку","созданные сделки","созданных сделок")}?`)) return;
    if(await post("/api/run", {deals: items, pipeline: $("#pipeline").value || "-", maxChat, notesOnly: true})) poll();
    return;
  }
  if(items.some(i => !i.name)){ alert("У некоторых сделок пустое название"); return; }
  const pipeline = $("#pipeline").value;
  if(!pipeline){ alert("Выберите воронку"); return; }
  const bad = list.filter(d => Object.keys(problems(d)).length).length;
  let msg = `Создать ${items.length} ${plural(items.length,"сделку","сделки","сделок")} в воронке «${pipeline}»?`;
  if(bad) msg += `\n\nУ ${bad} есть замечания (подсвечены жёлтым).`;
  msg += maxChat ? `\n\nСписки детей — из чата MAX «${maxChat}».` : "\n\nЧат MAX не указан — без списков детей.";
  if(!S.loggedIn) msg += "\n\nОткроется окно amoCRM — если попросит, войдите в аккаунт.";
  if(!confirm(msg)) return;
  if(await post("/api/run", {deals: items, step: $("#step").checked, pipeline, maxChat})) poll();
}
$("#btnRun").onclick = () => run(selected());
$("#btnRetry").onclick = () => run(failedRows());
$("#btnNotes").onclick = () => run(noteRows(), true);
$("#maxChat").value = store.get("maxChat");
$("#maxChat").onchange = e => store.set("maxChat", e.target.value.trim());
$("#btnStop").onclick = () => post("/api/stop");
$("#btnContinue").onclick = () => post("/api/continue");
$("#conn").onclick = () => { if(S.phase !== "run") post("/api/login"); };  // старое окно amoCRM закроется
$("#step").checked = store.get("step") === "1";
$("#step").onchange = e => store.set("step", e.target.checked ? "1" : "0");

function fillPipelines(list){
  const sel = $("#pipeline");
  const key = list.join("|");
  if(sel.dataset.key === key) return;
  sel.dataset.key = key;
  const saved = store.get("pipeline");
  sel.innerHTML = list.map(p => `<option ${p===saved?"selected":""}>${esc(p)}</option>`).join("");
  refreshProgress();
}
async function refreshProgress(){
  const rows = deals, pipeline = $("#pipeline").value;
  if(!rows.length || S.running) return;
  const names = rows.map(d => d.name);
  const response = await fetch("/api/progress", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({names,pipeline})});
  if(!response.ok) return;
  const records = await response.json();
  if(rows !== deals || pipeline !== $("#pipeline").value || S.running) return;
  rows.forEach((d,i) => {
    if(d.name !== names[i]) return;
    const wasDone = isDone(d), rec = records[i];
    d.done = rec.url; d.doneStatus = rec.status; d.note = !!rec.note; d._final = false;
    if(isDone(d)) d.sel = false;
    else if(wasDone) d.sel = !d.red;
  });
  S.rows = {}; renderRows();
}
$("#pipeline").onchange = e => { store.set("pipeline", e.target.value); refreshProgress(); };

// ---------- состояние с сервера ----------
async function poll(){
  try{
    S = await (await fetch("/api/status")).json();
  }catch(e){
    $("#conn").textContent = "программа закрыта — запустите её снова"; $("#conn").classList.remove("on"); return;
  }
  fillPipelines(S.pipelines || []);
  if(S.rowPipeline && S.rowPipeline !== $("#pipeline").value) S.rows = {};
  if(S.version) $("#ver").textContent = "версия " + S.version;
  const conn = $("#conn");
  conn.textContent = S.loggedIn ? "amoCRM подключена" : (S.phase === "login" ? "amoCRM: вход…" : "amoCRM: войти");
  conn.classList.toggle("on", S.loggedIn);
  conn.disabled = S.phase === "run";
  conn.title = S.phase === "run" ? "Идёт создание сделок"
    : (S.loggedIn || S.phase === "login") ? "Открыть окно amoCRM заново (старое закроется)" : "Открыть окно amoCRM и войти";
  const log = $("#log"), atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 5;
  const txt = S.log.join("\n");
  if(log.textContent !== txt){ log.textContent = txt; if(atBottom) log.scrollTop = log.scrollHeight; }
  $("#waiting").classList.toggle("show", !!S.waiting);
  $("#waitText").textContent = S.waiting || "";
  const showP = S.running || S.total > 0;
  $("#progress").classList.toggle("show", showP && deals.length > 0);
  if(S.total){
    const finished = S.doneN + S.failedN;
    $("#barFill").style.width = Math.round(finished / S.total * 100) + "%";
    $("#pCount").innerHTML = `Создано <b>${S.doneN}</b> из <b>${S.total}</b>` + (S.failedN ? ` · ошибок <b>${S.failedN}</b>` : "");
    document.title = S.running ? `${finished}/${S.total} · Сделки в amoCRM` : "Сделки в amoCRM";
  }
  $("#lastLog").textContent = S.running ? (S.log[S.log.length-1] || "").replace(/^\S+\s+/, "") : "";
  paintStatuses(); updateUI();
}
setInterval(poll, 1000); poll();

// закрытие окна = выход из программы; если идёт создание сделок — сначала спросить
window.addEventListener("beforeunload", e => {
  const busy = S.running && !S.waiting && S.total > 0 && S.doneN + S.failedN < S.total;
  if(busy){ e.preventDefault(); e.returnValue = ""; }  // идёт создание сделок — спросить
});
</script>
</body>
</html>
